spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  config:
    import: 'optional:consul:'
  application:
    name: account-service
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery: account-service-i1
      config:
        enabled: true
        watch:
          enabled: true

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  kafka:
    producer:
      bootstrap-servers: localhost:9092, localhost:9094
      client-id: account-service
      acks: all
      properties:
        linger:
          ms: 0
    topics:
      request:
        name: request-event-topic
        partitions: 1
        replication-factor: 3
        dlt:
          name: ${spring.kafka.topics.request.name}.DLT
          partitions: 1
          replication-factor: 3

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8090

logging:
  level:
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,env,refresh

cache:
  key:
    pagination:
      block-size: 100
  minutes-ttl: 60
  minutes-version-ttl: 720