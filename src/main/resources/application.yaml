spring:
  mvc:
    servlet:
      path: /api/v1

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

app:
  service:
    free-account-numbers: default

account:
  number:
    prefixes:
      DEBIT: 4200
      SAVINGS: 5326
    batch:
      size: 500
      fallback-size: 50

server:
  port: 8090

logging:
  level:
    root: info

scheduler:
  account-numbers-generation:
    debit: "0 0 0/12 * * *"
    savings: "0 30 0/12 * * *"

retry:
  account-number:
    generation:
      max-attempts: 3
      delay: 1000