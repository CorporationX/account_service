spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  config:
    import: 'optional:consul:'
  application:
    name: account-service
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery: account-service-i1
      config:
        enabled: true
        watch:
          enabled: true

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
#    clear-checksums: true

server:
  port: 8090

logging:
  level:
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,env,refresh
