spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

retry:
  account:
    close:
      maxAttempts: 2
      delay: 1000
    block:
      maxAttempts: 2
      delay: 1000
    accrueInterest:
      maxAttempts: 2
      delay: 1000

schedule:
  cron:
    interest: 0 0 9 * * ?

thread-pool:
  scheduled:
    size: 2

balance:
  scale: 2
  divideScale: 5
  roundingMode: HALF_UP

server:
  port: 8090

user-service:
  host: localhost
  port: 8080
project-service:
  host: localhost
  port: 8082

account-numbers:
  size: 10
  base-prefixes: BANK, ACCOUNT, DEPOSIT, PAYMENT
  digits: 0123456789
  scheduled: 0 0 0 * * *

logging:
  level:
    root: info
