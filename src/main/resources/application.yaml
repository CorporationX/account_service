spring:
  profiles:
    active: local

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      retries: 3
    consumer:
      group-id: "account-group"
      retry-interval-ms: 5000
      max-attempts: 5
      concurrent-threads-count: 3
    topics:
      dlqAuthPayment: "auth-payment.DLT"
      authPaymentRequest: "auth-message-request-topic"
      authPaymentResponse: "auth-message-response-topic"
      authPaymentCancelRequest: "cancel-message-request-topic"
      authPaymentCancelResponse: "cancel-message-response-topic"
      authPaymentClearingRequest: "clearing-message-request-topic"
      authPaymentClearingResponse: "clearing-message-response-topic"

scheduled:
  sendPaymentsToKafka:
    cron: "0 * * * * *"
    batchSize: 100

server:
  port: 8090

logging:
  level:
    root: info
