spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: ${DB_SCHEMA:public}

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    defaultSchema: ${DB_SCHEMA:public}
    liquibaseSchema: ${DB_SCHEMA:public}

server:
  port: 8090
  servlet:
    context-path: /api/v1

logging:
  level:
    root: info
