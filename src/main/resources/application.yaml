spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
    drop-first: false

  data:
    redis:
      port: 6379
      host: localhost
      channel:
        requestAndOperations: follower_channel

notification:
  templates:
    request-created: "Ваш запрос (%s) создан. Статус: %s"
    request-status-updated: "Статус вашего запроса (%s) изменён на: %s"
    request-flag-updated: "Флаг open вашего запроса (%s) изменён на: %s"
    request-context-updated: "Контекст запроса (%s) был обновлён"

scheduler:
  notification:
    delay: 10000

server:
  port: 8090

logging:
  level:
    root: info
