spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jackson:
    serialization:
      write-dates-as-timestamps: false

  retry:
    account-update:
      max-attempts: 3
      delay-ms: 50
      multiplier: 2

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  kafka:
    bootstrap-servers: localhost:9092
    group-id: account_service

server:
  port: 8090

logging:
  level:
    root: info

account:
  number:
    batch:
      size: 10
    formats:
      PERSONAL:
        prefix: "4200"
        counterDigits: 12
      BUSINESS:
        prefix: "5236"
        counterDigits: 12
      FOREX:
        prefix: "8600"
        counterDigits: 12
      SAVINGS:
        prefix: "5336"
        counterDigits: 12