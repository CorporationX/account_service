spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8090

logging:
  level:
    root: info

account:
  number:
    cron: "0 * * * * ?"
    check:
      enabled: false
      fixed-rate: 1000
    batch-size-default: 5
    batch-size:
      INDIVIDUAL: 5
      LEGAL: 5
      SAVINGS: 10
      DEBIT: 5
      CREDIT: 5