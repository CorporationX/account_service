spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mvc:
    servlet:
      path: "/api/v1"

  retry:
    maxAttempts: 3
    delay: 100

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8090

logging:
  level:
    root: info

account:
  number:
    generation:
      individual:
        min-free-numbers: 1000
      business:
        min-free-numbers: 1000
      currency:
        min-free-numbers: 1000
      savings:
        min-free-numbers: 1000
      credit:
        min-free-numbers: 1000

scheduler:
  account-number:
    batch-size: 100
    cron: "0 0 0 * * ?"
    lock-name: "reportGenerationTask"
    lock-at-least-for: "5m"
    lock-at-most-for: "10m"

shedlock:
  enabled: true
  defaults:
    lock-at-most-for: "10m"
  provider:
    jdbc:
      table-name: "shedlock"
      use-db-time: true