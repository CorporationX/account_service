spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      retry:
        max-attempts: 3
        backoff-delay: 1000
        backoff-multiplier: 2
      channels:
        request_events_channel:
          name: request_events

server:
  port: 8090

logging:
  level:
    root: info

services:
  user-service:
    host: localhost
    port: 8080
  project-service:
    host: localhost
    port: 8082
  payment-service:
    host: localhost
    port: 9080

outbox-processor:
  pause-timeout-ms: 1000
  request-events-batch-size: 100
  threads-pool-size: 1
