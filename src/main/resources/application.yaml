spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8090

logging:
  level:
    root: info

account:
  type:
    CURRENT: 4200
    SETTLEMENT: 5200
    CREDIT: 7700
    DEPOSIT: 1100
    BUDGET: 3300
  number:
    init-zeros: 8
    generate-per-time: 5000
    base-number-length: 4