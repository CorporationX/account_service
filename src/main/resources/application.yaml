spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8090

logging:
  level:
    root: info

account:
  number-length: 12
  type:
    number:
      batch-size: 200
      first-numbers:
        DEPOSIT: 4200
        CREDIT: 5236

scheduler:
  cron-deposit: "0 0 0 * * *"
  cron-credit: "0 0 0 * * *"

