spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    kafka:
      bootstrap-servers: localhost:9092
      consumer:
        group-id: payment-group
        auto-offset-reset: earliest
      producer:
        acks: all
      topics:
        payment-operation:
          name: "payment-operation-topic"
          partitions: 3
          replicas: 1

  profiles:
    active: local

server:
  port: 8090

logging:
  level:
    root: debug

cron-setting:
  tariff-rate-calculator: 0 0 */2 * * *

thread-pool-setting:
  tariff-rate-calculator:
    size: 3
    timeout: 30
    hours: 24
