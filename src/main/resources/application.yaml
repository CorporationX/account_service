spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/account-service
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  cloud:
    openfeign:
      client:
        config:
          user-service:
            url: http://localhost:8080/users/api/v1
          project-service:
            url: http://localhost:8082/projects/api/v1

server:
  port: 8090
  servlet:
    context-path: /accounts/api/

user-service:
  host: localhost
  port: 8080
project-service:
  host: localhost
  port: 8082


logging:
  level:
    root: info
