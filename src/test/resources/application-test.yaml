spring:
  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-test.yaml
    enabled: true

scheduled:
  sendPaymentsToKafka:
    cron: "*/5 * * * * *"
    batchSize: 100

server:
  port: 8090
